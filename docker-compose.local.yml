services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9080:8080"
    volumes:
      - maia-data:/data
    environment:
      - SERVER_PORT=8080
      - QDRANT_URL=http://qdrant:6333
      - DATA_DIR=/data
      - STATIC_DIR=/app/static
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant-data:
  maia-data:
