[package]
name = "maia"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP Server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Vector DB
qdrant-client = "=1.13.0"

# HTTP Client (for LLM APIs)
reqwest = { version = "0.11", features = ["json"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
unicode-segmentation = "1.10"

# Crypto (API Key hashing)
sha2 = "0.10"

# 비밀번호 해싱 (argon2id — 저엔트로피 입력이라 SHA-256 부적합)
argon2 = "0.5"

# CSPRNG (세션 토큰 — uuid 조합 금지, OS 엔트로피 직접 사용)
rand = "0.8"

# Base64 (Codex JWT exp 파싱 — base64url payload 디코딩)
base64 = "0.22"

# 로컬 임베딩 (multilingual-e5-small, onnxruntime 기반. ort download-binaries로
# 프리빌트 onnxruntime 바이너리를 빌드시 내려받는다 — 외부 모델은 런타임 lazy 다운로드).
fastembed = "5"

# Async utilities
futures = "0.3"

# Glob matching (커넥터 제외 패턴)
glob = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
# 라우터 폴딩 시맨틱 테스트 (main.rs router_tests — oneshot)
tower = { version = "0.4", features = ["util"] }
# 외부 HTTP mock (Claude OAuth·Codex refresh/responses 상태머신 테스트 — 라이브 토큰 금지)
wiremock = "0.6"
