services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data/raw:/data/raw
      - ./data/settings:/data/settings
    environment:
      - SERVER_PORT=8080
      - QDRANT_URL=http://qdrant:6333
      - DATA_DIR=/data
      - STATIC_DIR=/app/static
    depends_on:
      - qdrant
    restart: unless-stopped
