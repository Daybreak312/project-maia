<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maia - Search</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Maia</div>
        <div class="nav-links">
            <a href="/">Add</a>
            <a href="/search.html" class="active">Search</a>
            <a href="/browse.html">Browse</a>
            <a href="/admin.html">Admin</a>
        </div>
    </nav>

    <main class="container">
        <h1>Search</h1>
        <p class="subtitle">Search your personal context with natural language.</p>

        <form id="searchForm" class="search-form">
            <input
                type="text"
                id="query"
                placeholder="e.g., 'Compare salaries from interviews last year'"
                autocomplete="off"
            >
            <button type="submit" id="searchBtn">
                <span class="btn-text">Search</span>
                <span class="btn-loading" style="display:none;">...</span>
            </button>
        </form>

        <div id="results" class="accordion-container">
            <p class="empty-state">Enter a query to search</p>
        </div>

        <div id="error" class="error-card" style="display:none;">
            <p id="errorMessage"></p>
        </div>
    </main>

    <div id="toast" class="toast" style="display:none;"></div>

    <script src="/app.js"></script>
    <script>
        const form = document.getElementById('searchForm');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('results');
        const errorCard = document.getElementById('error');
        const toast = document.getElementById('toast');

        let lastQuery = '';

        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : ' success');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('query').value.trim();
            if (!query) return;

            lastQuery = query;
            searchBtn.disabled = true;
            searchBtn.querySelector('.btn-text').style.display = 'none';
            searchBtn.querySelector('.btn-loading').style.display = 'inline';
            errorCard.style.display = 'none';
            resultsContainer.innerHTML = '<p class="empty-state">Searching...</p>';

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, limit: 10 })
                });

                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || 'Search failed');
                }

                const data = await response.json();

                if (data.results.length === 0) {
                    resultsContainer.innerHTML = '<p class="empty-state">No results found</p>';
                    return;
                }

                // Fetch full documents for accordion view
                const fullDocs = await Promise.all(
                    data.results.map(async (r) => {
                        const docRes = await fetch(`/documents/${r.id}`);
                        const doc = await docRes.json();
                        return { ...doc, relevance_score: r.relevance_score };
                    })
                );

                renderResults(fullDocs);
            } catch (err) {
                document.getElementById('errorMessage').textContent = err.message;
                errorCard.style.display = 'block';
                resultsContainer.innerHTML = '';
            } finally {
                searchBtn.disabled = false;
                searchBtn.querySelector('.btn-text').style.display = 'inline';
                searchBtn.querySelector('.btn-loading').style.display = 'none';
            }
        });

        function renderResults(results) {
            resultsContainer.innerHTML = results.map((entry, i) => `
                <div class="accordion-item" data-id="${entry.id}">
                    <div class="accordion-header" onclick="toggleAccordion(this)">
                        <div class="accordion-title">
                            <span class="accordion-arrow">&#9654;</span>
                            <span class="accordion-rank">#${i + 1}</span>
                            <span class="accordion-summary">${escapeHtml(entry.summary)}</span>
                        </div>
                        <div class="accordion-meta">
                            <span class="accordion-score">${(entry.relevance_score * 100).toFixed(0)}%</span>
                            <span class="accordion-date">${formatDate(entry.created_at)}</span>
                        </div>
                    </div>
                    <div class="accordion-content">
                        <div class="accordion-tags">
                            ${entry.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
                        </div>
                        <div class="accordion-entities">
                            ${entry.entities.map(e => `
                                <div class="entity-item">
                                    <span class="entity-type">${escapeHtml(e.entity_type)}</span>
                                    <span class="entity-value">${escapeHtml(e.value)}</span>
                                    ${e.context ? `<span class="entity-context">${escapeHtml(e.context)}</span>` : ''}
                                </div>
                            `).join('') || ''}
                        </div>
                        <div class="accordion-raw">
                            <label>Raw Content</label>
                            <pre class="raw-content">${escapeHtml(entry.raw_content)}</pre>
                            <textarea class="edit-textarea" style="display:none;">${escapeHtml(entry.raw_content)}</textarea>
                        </div>
                        <div class="accordion-actions">
                            <button class="btn-edit view-btn" onclick="startEdit('${entry.id}')">Edit</button>
                            <button class="btn-danger view-btn" onclick="deleteEntry('${entry.id}')">Delete</button>
                            <button class="btn-secondary edit-btn" style="display:none;" onclick="cancelEdit('${entry.id}')">Cancel</button>
                            <button class="btn-primary edit-btn" style="display:none;" onclick="saveEdit('${entry.id}')">Save</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleAccordion(header) {
            const item = header.closest('.accordion-item');
            item.classList.toggle('open');
        }

        function startEdit(id) {
            const item = document.querySelector(`[data-id="${id}"]`);
            const pre = item.querySelector('.raw-content');
            const textarea = item.querySelector('.edit-textarea');
            const viewBtns = item.querySelectorAll('.view-btn');
            const editBtns = item.querySelectorAll('.edit-btn');

            textarea.value = pre.textContent;
            pre.style.display = 'none';
            textarea.style.display = 'block';
            textarea.focus();

            viewBtns.forEach(b => b.style.display = 'none');
            editBtns.forEach(b => b.style.display = 'inline-block');
        }

        function cancelEdit(id) {
            const item = document.querySelector(`[data-id="${id}"]`);
            const pre = item.querySelector('.raw-content');
            const textarea = item.querySelector('.edit-textarea');
            const viewBtns = item.querySelectorAll('.view-btn');
            const editBtns = item.querySelectorAll('.edit-btn');

            pre.style.display = 'block';
            textarea.style.display = 'none';

            viewBtns.forEach(b => b.style.display = 'inline-block');
            editBtns.forEach(b => b.style.display = 'none');
        }

        async function saveEdit(id) {
            const item = document.querySelector(`[data-id="${id}"]`);
            const textarea = item.querySelector('.edit-textarea');
            const saveBtn = item.querySelector('.btn-primary');
            const content = textarea.value.trim();

            if (!content) {
                showToast('Content cannot be empty', true);
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                const response = await fetch(`/documents/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });

                if (!response.ok) throw new Error('Update failed');

                const data = await response.json();

                // Update DOM directly
                item.querySelector('.accordion-summary').textContent = data.summary;
                item.querySelector('.accordion-tags').innerHTML =
                    data.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
                item.querySelector('.accordion-entities').innerHTML =
                    data.entities.map(e => `
                        <div class="entity-item">
                            <span class="entity-type">${escapeHtml(e.entity_type)}</span>
                            <span class="entity-value">${escapeHtml(e.value)}</span>
                            ${e.context ? `<span class="entity-context">${escapeHtml(e.context)}</span>` : ''}
                        </div>
                    `).join('') || '';
                item.querySelector('.raw-content').textContent = content;

                // Switch back to view mode
                cancelEdit(id);
                showToast('Entry updated');
            } catch (err) {
                showToast(err.message, true);
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save';
            }
        }

        async function deleteEntry(id) {
            if (!confirm('Delete this entry?')) return;

            try {
                const response = await fetch(`/documents/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Delete failed');

                showToast('Entry deleted');
                // Re-search
                if (lastQuery) {
                    form.dispatchEvent(new Event('submit'));
                }
            } catch (err) {
                showToast(err.message, true);
            }
        }
    </script>
</body>
</html>
